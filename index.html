<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla de Videojuegos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Mis Videojuegos Favoritos</h1>

  <table id="tablaJuegos">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Compañía</th>
        <th>Plataforma</th>
        <th>Valoración</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
      <!-- El cuerpo se queda vacío: los datos vendrán de JavaScript -->
    </tbody>
  </table>

  <!-- Enlazamos el archivo JavaScript -->
  <script src="app.js"></script>
</body>
</html>
